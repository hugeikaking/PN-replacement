.official-translator *{box-sizing:border-box}
.official-translator header{display:flex;justify-content:space-between;align-items:start;padding:12px 0 20px}
.official-translator h1{font-size:28px;line-height:1.3;margin:8px 0}
.official-translator h2,.official-translator .input-title{font-size:19px;font-weight:600;margin:0 0 12px;display:block}
.official-translator h3{font-size:17px;margin-top:20px}
.official-translator p{margin:8px 0;overflow-wrap:anywhere}
.official-translator .eyebrow,.official-translator .meta{color:#67716d;font-size:14px}
.official-translator .version{background:#e7f5ec;color:#08783f;padding:4px 12px;border-radius:20px}

.official-translator .panel>p{color:#59635e}

.official-translator .file-button,.official-translator .primary{background:#07c160;color:#fff;border:0}
.official-translator .file-button{margin:12px 0}
.official-translator .primary{width:100%;margin-top:16px;font-weight:600}
.official-translator button:disabled{background:#e2e7e4;color:#7c8781;cursor:default}
.official-translator .secondary,.official-translator .examples button,.official-translator .mode-tabs button{border:1px solid #dce5df;background:#fff;color:#08783f}
.official-translator textarea{display:block;width:100%;font:inherit;line-height:1.6;border:1px solid #dce5df;border-radius:8px;padding:14px;resize:vertical;background:#fafcfb;color:inherit}
.official-translator textarea:focus{outline:2px solid #07c160;outline-offset:2px}
.official-translator #catalog-files{display:block;max-width:100%;font:inherit}
.official-translator #catalog-files::file-selector-button{display:none}
.official-translator .examples{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.official-translator .examples button{font-size:14px}
.official-translator .help{font-size:14px;color:#65706a;margin:12px 0}
.official-translator summary{cursor:pointer;min-height:44px;display:list-item;padding:10px 0}
.official-translator .success{color:#08783f!important}
.official-translator .error{color:#bf232d!important}
.official-translator .warning{color:#97620b;font-size:14px}
.official-translator .note{font-size:14px;color:#65706a!important}
.official-translator .selection-bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.official-translator .product{border:1px solid #e0e7e2;border-radius:8px;padding:16px;margin:12px 0}
.official-translator .product-top{display:flex;align-items:center;gap:12px}
.official-translator .part-number{flex:1;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;font-size:18px}
.official-translator .product input{width:22px;height:22px;accent-color:#07c160;flex-shrink:0}
.official-translator .choice{display:inline-flex;width:44px;min-height:44px;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.official-translator .links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.official-translator a{color:#08783f;min-height:44px;display:inline-flex;align-items:center}
.official-translator .review-group{border:1px solid #efdfbb;background:#fffcf5;border-radius:8px;padding:12px 16px;margin:16px 0}
.official-translator .review-group>.product{background:#fff}
.official-translator footer{font-size:14px;color:#67716d;padding:16px 4px}
.official-translator .search-status{padding:8px 4px;color:#08783f}
.official-translator [hidden]{display:none!important}
.official-translator .input-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.official-translator .input-heading .input-title{margin:0}
.official-translator .input-heading button{font-size:14px}
.official-translator button:focus-visible,.official-translator summary:focus-visible,.official-translator a:focus-visible{outline:2px solid #07c160;outline-offset:3px}
.official-translator .mode-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.official-translator .mode-tabs button{flex:1}
.official-translator .mode-tabs button[aria-pressed=true]{color:#fff;background:#07c160;border-color:#07c160}
.official-translator .material-description{font-weight:600;color:#08783f!important}
.official-translator table{width:100%;border-collapse:collapse;font-size:14px}
.official-translator td,.official-translator th{text-align:left;padding:8px;border-bottom:1px solid #e8ece9;overflow-wrap:anywhere}
